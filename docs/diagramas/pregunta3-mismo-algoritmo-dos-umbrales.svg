<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Por qué la Pregunta 3 reutiliza UFDS con otro umbral</title>
<desc>Diagrama que muestra cómo la misma técnica UFDS se aplica dos veces en el aplicativo, con un umbral de confianza distinto en cada caso: 0.70 para el ranking de la Pregunta 1, y 0.95 para identificar equipos específicos en la Pregunta 3, mostrando que subir el umbral reduce el tamaño del grupo gigante y revela comunidades más pequeñas.</desc>
<rect x="240" y="20" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="40" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">UFDS</text>
<text x="340" y="58" text-anchor="middle" font-size="12" fill="#085041">Misma técnica, un parámetro</text>

<line x1="300" y1="76" x2="180" y2="130" stroke="#888780" stroke-width="1"/>
<line x1="380" y1="76" x2="500" y2="130" stroke="#888780" stroke-width="1"/>

<rect x="60" y="130" width="240" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="152" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Umbral 0.70 (Pregunta 1)</text>
<text x="180" y="170" text-anchor="middle" font-size="12" fill="#444441">17 grupos, 1 gigante de 1458</text>

<rect x="380" y="130" width="240" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="152" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Umbral 0.95 (Pregunta 3)</text>
<text x="500" y="170" text-anchor="middle" font-size="12" fill="#712B13">17 equipos pequeños y nítidos</text>

<line x1="180" y1="194" x2="180" y2="230" stroke="#888780" stroke-width="1"/>
<line x1="500" y1="194" x2="500" y2="230" stroke="#888780" stroke-width="1"/>

<rect x="60" y="230" width="240" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="255" text-anchor="middle" font-size="12" fill="#444441">Sirve como criterio B del ranking</text>

<rect x="380" y="230" width="240" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="255" text-anchor="middle" font-size="12" fill="#712B13">Vía de colesterol, cohesina, etc.</text>

<text x="40" y="305" font-size="12" fill="#5F5E5A">Un umbral más alto exige conexiones de mayor confianza, lo que aísla comunidades más pequeñas y específicas.</text>
</svg>
